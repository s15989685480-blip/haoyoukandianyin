<script>
const SUPABASE_URL = "https://udmexrwaacjapoicvsfz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_u49G3mGU6cekwMlgV5Yc8w_xFUIkUVO";
var supabase = null;
function loadScript(src) {
return new Promise((resolve, reject) => {
const s = document.createElement('script');
s.src = src;
s.onload = resolve;
s.onerror = reject;
document.body.appendChild(s);
})
}
async function initSupabase() {
console.log("正在下载supabase SDK...");
await loadScript("https://unpkg.com/@supabase/supabase-js@2");
console.log("SDK下载完成，准备初始化");
try {
supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
console.log("✅Supabase初始化成功！", supabase);
} catch (err) {
console.error("❌初始化失败", err);
}
}
document.addEventListener("DOMContentLoaded", () => {
initSupabase();
});
// 全局状态
let currentUser = null;
let currentRoomId = null;
let currentInviteCode = null;
let localStream = null;
let peers = {};
let lang = "zh";
let privateRoomMode = false;
let isRoomOwner = false;
// =========新增WebRTC全局变量=========
let signalSub = null;
// ========== 新增工具函数 ==========
async function clearAllChannelsWait(){
    supabase.removeAllChannels();
    await new Promise(resolve=>setTimeout(resolve,250));
}
// 聊天订阅实时监听
async function subscribeChat(){
if(!supabase){
alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
return;
}
const chatChannel = supabase.channel(`chat:${currentRoomId}`);
chatChannel.on('postgres_changes', {
event:'INSERT', schema:'public', table:'messages_new', filter:`room_id=eq.${currentRoomId}`
},(payload)=>{
appendChat(payload.new.author, payload.new.content, payload.new.created_at);
});
chatChannel.subscribe();
}
// ========= WebRTC信令实时订阅 表名 webrtc_signals =========
async function subscribeWebRTCSignal(){
console.log("🔔 WebRTC订阅函数开始执行");
if(!supabase){
alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
return;
}
const rtcChannel = supabase.channel(`rtc:${currentRoomId}`);
rtcChannel.on('postgres_changes',{
event:"INSERT",
schema:"public",
table:"webrtc_signals"
},async (payload)=>{
const sig = payload.new;
if(sig.from_user === currentUser.id) return;
console.log("📩收到远端信令 type:", sig.signal && sig.signal.type);
const remoteKey = "peer-1";
if(!peers[remoteKey] && localStream){
peers[remoteKey] = new SimplePeer({initiator:false, trickle:false, stream:localStream});
setupPeerEvents(peers[remoteKey], remoteKey);
}
if(peers[remoteKey]){
peers[remoteKey].signal(sig.signal);
}
});
rtcChannel.subscribe();
signalSub = rtcChannel;
}
async function sendSignal(signalObj){
  if(!supabase || !currentRoomId) return;
  await supabase.from("webrtc_signals").insert([{
    room_id: currentRoomId,
    from_user: currentUser.id,
    to_user: '00000000-0000-0000-0000-000000000000',
    signal: signalObj
  }]);
}
function setupPeerEvents(peer, remoteKey){
peer.on("signal", (sig)=>{
console.log("📤发送信令");
sendSignal(sig);
});
peer.on("stream", (remoteStream)=>{
console.log("✅拿到远端视频流！");
renderRemoteVideo(remoteStream, remoteKey);
});
peer.on("close",()=>{
removeRemoteVideo(remoteKey);
delete peers[remoteKey];
});
peer.on("error",(err)=>{
console.error("peer error",err);
removeRemoteVideo(remoteKey);
delete peers[remoteKey];
})
}
// =================================
// 双语字典（新增词条）
const i18n = {
zh:{
welcome:"欢迎来到SyncWatch",username:"用户名",password:"Password",register:"注册",login:"登录",
friends:"好友",createRoom:"创建房间",logout:"退出",search:"搜索",play:"播放",pause:"暂停",
syncTip:"房间内播放状态自动同步所有人",videoMembers:"视频参与者",openCam:"开启摄像头",
closeCam:"关闭摄像头",mic:"麦克风",chatRoom:"房间聊天",friendList:"好友列表",add:"添加",
joinRoom:"加入",roomId:"当前房间ID",inviteCode:"邀请码",clearChat:"清空聊天",oneOnOne:"一对一私聊"
},
en:{
welcome:"Welcome to SyncWatch",username:"Username",password:"Password",register:"Register",login:"Login",
friends:"Friends",createRoom:"Create Room",logout:"Logout",search:"Search",play:"Play",pause:"Pause",
syncTip:"Playback sync for all members",videoMembers:"Video Participants",openCam:"Open Camera",
closeCam:"Close Camera",mic:"Mic",chatRoom:"Room Chat",friendList:"Friend List",add:"Add",
joinRoom:"Join",roomId:"Room ID",inviteCode:"Invite Code",clearChat:"Clear Chat",oneOnOne:"1‑to‑1 Chat"
}
};
// 切换语言
function switchLang(){
lang = document.getElementById("langSelect").value;
document.querySelectorAll("[data-i18n]").forEach(el=>{
const key = el.getAttribute("data-i18n");
el.innerText = i18n[lang][key];
})
document.querySelectorAll("[data-placeholder-zh]").forEach(input=>{
input.placeholder = lang==="zh"?input.dataset.placeholderZh:input.dataset.placeholderEn;
})
}
// 生成6位邀请码
function genInviteCode(){
return Math.random().toString(36).substring(2,8).toUpperCase();
}
// 用户登录注册
async function registerUser(){
if(!supabase){
return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
const uname = document.getElementById("usernameInput").value.trim();
const pwd = document.getElementById("pwdInput").value.trim();
if(!uname||!pwd) return alert(lang==="zh"?"用户名密码不能为空":"Username & password required");
const {data,error}=await supabase.from("users").insert([{username:uname,password:pwd,is_online:true}]).select();
if(error) return alert(error.message);
alert(lang==="zh"?"注册成功":"Register success");
currentUser = data[0];
showMain();
}
async function loginUser(){
if(!supabase){
return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
const uname = document.getElementById("usernameInput").value.trim();
const pwd = document.getElementById("pwdInput").value.trim();
const {data}=await supabase.from("users").select("*").eq("username",uname).eq("password",pwd).single();
if(!data) return alert(lang==="zh"?"账号密码错误":"Wrong credentials");
currentUser = data;
await supabase.from("users").update({is_online:true}).eq("id",currentUser.id);
showMain();
}
function showMain(){
document.getElementById("authModal").classList.add("hidden");
document.getElementById("mainPage").classList.remove("hidden");
}
async function logout(){
if(!supabase){
return;
}
await clearAllChannelsWait();
if(currentUser){
await supabase.from("users").update({is_online:false}).eq("id",currentUser.id);
}
currentUser=null;
currentRoomId=null;
currentInviteCode=null;
localStream=null;
Object.values(peers).forEach(p=>p.destroy?.());
peers={};
document.getElementById("showRoomId").innerText="-";
document.getElementById("showInviteCode").innerText="-";
document.getElementById("authModal").classList.remove("hidden");
document.getElementById("mainPage").classList.add("hidden");
}
// 房间 创建房间（A，发起方 initiator:true）
async function createRoom(){
  if(!supabase){
    return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
  }
  await clearAllChannelsWait();
  const code = genInviteCode();
  const roomId = crypto.randomUUID();
  const {data, error}=await supabase.from("rooms").insert([{
    id: roomId,
    owner:currentUser.id,
    invite_code:code,
    movie_url:"",
    play_status:"pause",
    is_private:privateRoomMode
  }]).select();
  if(error){
    console.error("创建房间失败",error);
    return alert(lang==="zh"?"创建房间失败":"Create room failed");
  }
  currentRoomId = data[0].id;
  currentInviteCode = code;
  isRoomOwner = true;
  document.getElementById("showRoomId").innerText = currentRoomId;
  document.getElementById("showInviteCode").innerText = currentInviteCode;
  await subscribeChat();
  await subscribeWebRTCSignal();
}
// 创建一对一私聊房间
async function createPrivateRoom(){
if(!supabase){
return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
privateRoomMode = true;
await createRoom();
}
// 电影搜索（谷歌搜索，模拟结果列表）
function searchMovie(){
const kw = document.getElementById("movieSearch").value.trim();
if(!kw) return;
const resultBox = document.getElementById("movieResultList");
resultBox.classList.remove("hidden");
resultBox.innerHTML = "";
window.open(`https://www.google.com/search?q=${encodeURIComponent(kw+" movie watch online")}`,"_blank");
const mockItems = [
{title: kw+" - Public Demo Source", url:""},
{title: kw+" Trailer", url:""}

// 播放同步
async function playSync(){
if(!supabase){
return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
if(!currentRoomId) return;
await supabase.from("rooms").update({play_status:"play"}).eq("id",currentRoomId);
}
async function pauseSync(){
if(!supabase){
return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
if(!currentRoomId) return;
await supabase.from("rooms").update({play_status:"pause"}).eq("id",currentRoomId);

// 清空聊天
async function clearChat(){
document.getElementById("chatBox").innerHTML="";
}
async function sendChat(){
  console.log("sendChat被调用");
  const msg = document.getElementById("chatInput").value.trim();
  console.log("msg内容：", msg);
  console.log("currentRoomId：", currentRoomId);
  if(!msg || !currentRoomId || msg.length === 0){
    return;
  }
  const payload = {
    room_id: currentRoomId,
    author: currentUser.username,
    content: msg
  };
  const {error} = await supabase
    .from('messages_new')
    .insert({
      room_id: currentRoomId,
      author: currentUser.username,
      content: msg
    }, {
      count:'none',
      returning:'minimal'
    });
  if(error){
    console.error("🔴插入消息失败error详情：", error);
    return;
  }
  document.getElementById("chatInput").value = "";
}
function appendChat(name,text,time){
  const box = document.getElementById("chatBox");
  if (!box) return;
  const div = document.createElement("div");
  const timeStr = time ? new Date(time).toLocaleTimeString() : "";
  div.innerHTML = `<span class="text-indigo-300">${name}</span> <span class="text-xs text-slate-400">${timeStr}</span>: ${text}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
// 摄像头 Simple‑Peer版本
async function startLocalVideo() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    renderLocalVideo(localStream);
    console.log("✅本地摄像头打开成功");
    const remoteKey = "peer-1";
    if(!peers[remoteKey]){
      const isInitiator = !isRoomOwner;
      peers[remoteKey] = new SimplePeer({initiator:isInitiator, trickle:false, stream:localStream});
      setupPeerEvents(peers[remoteKey], remoteKey);
      console.log("P2P角色 initiator:", isInitiator);
    }
  } catch(err) {
    alert(lang==="zh"?"获取摄像头失败":"Camera access denied");
    console.error(err);
  }
}
function stopLocalVideo(){
  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
    localStream = null;
  }
  Object.keys(peers).forEach(uid=>{
    peers[uid].destroy();
    removeRemoteVideo(uid);
  });
  peers={};
  const localDom = document.getElementById("vid-local");
  if(localDom) localDom.remove();
}
function renderLocalVideo(stream){
const container = document.getElementById("videoContainer");
const div = document.createElement("div");
div.className="video-box draggable-video";
div.id="vid-local";
div.innerHTML = `<video autoplay muted playsinline></video>`;
div.querySelector("video").srcObject = stream;
container.appendChild(div);
}
function renderRemoteVideo(stream,uid){
if(document.getElementById("vid-"+uid)) return;
const container = document.getElementById("videoContainer");
const div = document.createElement("div");
div.className="video-box draggable-video";
div.id="vid-"+uid;
div.innerHTML = `
<video autoplay playsinline></video>
<button onclick="removeRemoteVideo('${uid}')" class="absolute top-1 right-1 bg-red-500 text-xs px-1 rounded">×</button>
`;
div.querySelector("video").srcObject = stream;
container.appendChild(div);
}
function removeRemoteVideo(uid){
const el = document.getElementById("vid-"+uid);
if(el) el.remove();
if(peers[uid]){
peers[uid].destroy();
delete peers[uid];
}
}
function toggleAudio(){
  if(!localStream){
    alert(lang==="zh"?"请先打开摄像头！":"Open camera first!");
    return;
  }
  const audioTracks = localStream.getAudioTracks();
  if(audioTracks.length === 0){
    alert(lang==="zh"?"没有检测到麦克风音频轨道":"No microphone audio track found");
    return;
  }
  const track = audioTracks[0];
  track.enabled = !track.enabled;
  console.log("麦克风状态切换：", track.enabled ? "开启" : "关闭");
  // 将更新后的音频轨道同步推送到所有P2P对端，修复远端不识别静音bug
  Object.values(peers).forEach(peer=>{
    if(peer && peer._pc){
      const audioSender = peer._pc.getSenders().find(s => s.track?.kind === "audio");
      if(audioSender){
        audioSender.replaceTrack(track);
      }
    }
  })
}

async function loadFriendList(){
if(!supabase){
return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
const dom = document.getElementById("friendListDom");
dom.innerHTML="";
const {data} = await supabase.from("friends")
.select("*,fuser:users!friends_friend_id_fkey(*)")
.eq("user_id",currentUser.id);
if(!data)return;
data.forEach(row=>{
const f = row.fuser;
const onlineMark = f.is_online ? '<span class="online-dot"></span>' : '<span class="offline-dot"></span>';
let btns = "";
if(row.status === "pending"){
btns = `<button onclick="acceptFriend('${row.id}')" class="bg-green-500 px-2 py-1 rounded text-sm mr-1">${lang==='zh'?'同意':'Accept'}</button>
<button onclick="rejectFriend('${row.id}')" class="bg-red-500 px-2 py-1 rounded text-sm">${lang==='zh'?'拒绝':'Reject'}</button>`;
}else if(row.status==="accept"){
btns = `<span class="text-xs text-slate-400">${lang==='zh'?'已是好友':'Friends'}</span>`;
}
const div = document.createElement("div");
div.className="mb-2 p-2 bg-slate-700 rounded flex justify-between items-center";
div.innerHTML = `<div>${onlineMark} ${f.username}</div><div>${btns}</div>`;
dom.appendChild(div);
})
}
async function sendFriendReq(){
if(!supabase){
return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
const fname = document.getElementById("addFriendInput").value.trim();
const {data}=await supabase.from("users").select("*").eq("username",fname).single();
if(!data) return alert(lang==="zh"?"用户不存在":"User not found");
await supabase.from("friends").insert([{user_id:currentUser.id,friend_id:data.id,status:"pending"}]);
alert(lang==="zh"?"好友请求已发送":"Friend request sent");
loadFriendList();
}
async function acceptFriend(rowId){
if(!supabase){
return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
await supabase.from("friends").update({status:"accept"}).eq("id",rowId);
loadFriendList();
}
async function rejectFriend(rowId){
if(!supabase){
return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
await supabase.from("friends").update({status:"reject"}).eq("id",rowId);
loadFriendList();
}
// 加入房间
async function joinByInvite() {
  console.log("joinByInvite 执行了");
  const inviteCode = document.getElementById("joinInviteInput").value.trim();
  console.log("拿到邀请码：", inviteCode);
  if (!inviteCode) {
    alert("请输入邀请码");
    return;
  }
  await clearAllChannelsWait();
  const { data, error } = await supabase
    .from("rooms")
    .select("*")
    .eq("invite_code", inviteCode)
    .single();
  if (error || !data) {
    alert("找不到该房间");
    return;
  }
  currentRoomId = data.id;
  currentInviteCode = inviteCode;
  isRoomOwner = (data.owner === currentUser.id);
  document.getElementById("showRoomId").innerText = currentRoomId;
  document.getElementById("showInviteCode").innerText = currentInviteCode;
  await subscribeChat();
  await subscribeWebRTCSignal();
  alert("✅成功加入房间！现在可以发送聊天消息");
}
