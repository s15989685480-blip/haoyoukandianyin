function loadScript(src) {
 return new Promise((resolve, reject) => {
 const s = document.createElement('script');
 s.src = src;
 s.onload = resolve;
 s.onerror = reject;
 document.body.appendChild(s);
 })
}
async function initSupabase() {
 console.log("正在下载supabase SDK...");
 await loadScript("https://unpkg.com/@supabase/supabase-js@2");
 console.log("SDK下载完成，准备初始化");
 try {
 supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 console.log("✅Supabase初始化成功！", supabase);
 } catch (err) {
 console.error("❌初始化失败", err);
 }
}

async function clearAllChannelsWait(){
    supabase.removeAllChannels();
    await new Promise(resolve=>setTimeout(resolve,250));
}

// 根据数据库room_members获取房间在线人数，进入房间就算，不需要摄像头
async function updateMemberCountFromDB(){
  if(!supabase || !currentRoomId) return;
  const {count} = await supabase
    .from("room_members")
    .select("*", {count:"exact", head:true})
    .eq("room_id", currentRoomId);
  const el = document.getElementById("memberCount");
  if(el) el.innerText = count ?? 0;
}

// 订阅房间成员实时变化，写入自己的进房记录
async function subscribeRoomMember(){
  if(!supabase || !currentRoomId) return;
  if(memberChannel) supabase.removeChannel(memberChannel);
  await supabase.from("room_members").insert([
    {room_id:currentRoomId, user_id:currentUser.id}
  ]);
  memberChannel = supabase.channel(`member:${currentRoomId}`)
  .on('postgres_changes',
    {event:'*', schema:'public', table:'room_members', filter:`room_id=eq.${currentRoomId}`},
    ()=>{
      updateMemberCountFromDB();
    }
  ).subscribe();
  await updateMemberCountFromDB();
}

async function subscribeChat(){
if(!supabase){
 alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
 return;
}
const chatChannel = supabase.channel(`chat:${currentRoomId}`);
chatChannel.on('postgres_changes', { event:'INSERT', schema:'public', table:'messages_new', filter:`room_id=eq.${currentRoomId}` },(payload)=>{
 console.log("📩收到别人消息",payload.new);
 appendChat(payload.new.author, payload.new.content, payload.new.created_at);
});
chatChannel.subscribe();
console.log("✅聊天订阅已开启");
}

async function subscribeRoomState(){
  if(!supabase || !currentRoomId) return;
  const roomChannel = supabase.channel(`roomstate:${currentRoomId}`);
  roomChannel.on('postgres_changes', {
    event:"UPDATE",
    schema:"public",
    table:"rooms",
    filter:`id=eq.${currentRoomId}`
  },async (payload)=>{
    const newStatus = payload.new.play_status;
    const video = document.getElementById("moviePlayer");
    if(!video) return;
    if(newStatus === "play"){
        await video.play().catch(e=>console.log("播放拦截",e));
    }else if(newStatus === "pause"){
        video.pause();
    }
  });
  roomChannel.subscribe();
  roomStateSub = roomChannel;
}

async function subscribeWebRTCSignal(){
console.log("🔔 WebRTC订阅函数开始执行");
if(!supabase || !currentRoomId){
 alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
 return;
}
const remoteKey = "peer-1";
// 【修复】房主这边，本地摄像头已经打开的情况下，主动创建peer发起offer
if(localStream && !peers[remoteKey]){
    const isInitiator = isRoomOwner;
    peers[remoteKey] = new SimplePeer({
        initiator: isInitiator,
        trickle: false,
        stream: localStream
    });
    setupPeerEvents(peers[remoteKey], remoteKey);
    console.log("本地主动新建Peer，initiator=", isInitiator);
}
 const rtcChannel = supabase.channel(`rtc:${currentRoomId}`);
 rtcChannel.on('postgres_changes',{
  event:"INSERT", schema:"public", table:"webrtc_signals"
 },async (payload)=>{
   const sig = payload.new;
   if(sig.from_user === currentUser.id) return;
   console.log("📩收到远端信令 type:", sig.signal && sig.signal.type);
     if (!peers[remoteKey] && localStream) {
       const isInitiator = false;
       peers[remoteKey] = new SimplePeer({
           initiator: isInitiator,
           trickle: false,
           stream: localStream
       });
       setupPeerEvents(peers[remoteKey], remoteKey);
       console.log("收到远端offer，新建Peer，initiator=", isInitiator);
   }
    if(peers[remoteKey]){
       peers[remoteKey].signal(sig.signal);
    }
 });
 rtcChannel.subscribe();
 signalSub = rtcChannel;
}

async function sendSignal(signalObj){
  if(!supabase || !currentRoomId) return;
  await supabase.from("webrtc_signals").insert([{
    room_id: currentRoomId,
    from_user: currentUser.id,
    to_user: '00000000-0000-0000-0000-000000000000',
    signal: signalObj
  }]);
}

// ========== 新逻辑：上传视频到Supabase Storage，只发送URL给对方 ==========
async function uploadVideoToSupabase(file){
  const fileName = Date.now() + "_" + file.name;
  document.getElementById("uploadProgressText").innerText = "上传中...";
  const { data, error } = await supabase.storage
    .from("sync_watch_videos")
    .upload(fileName, file, {cacheControl:"3600"});
  if(error){
    console.error("上传失败",error);
    alert(lang==="zh"?"视频上传失败":"Upload failed");
    document.getElementById("uploadProgressText").innerText = "";
    return null;
  }
  // 获取公开访问url
  const {data:urlData} = supabase.storage
    .from("sync_watch_videos")
    .getPublicUrl(fileName);
  const videoUrl = urlData.publicUrl;
  console.log("视频上传完成：",videoUrl);
  document.getElementById("uploadProgressText").innerText = "✅上传完成";

  // 本地自己加载视频
  const player = document.getElementById("moviePlayer");
  player.src = videoUrl;
  // 通过dataChannel把url发送给对方B
  broadcastDataMessage({
    type:"setRemoteVideo",
    videoUrl: videoUrl
  })
  // 更新房间数据库的movie_url
  await supabase.from("rooms").update({movie_url:videoUrl}).eq("id",currentRoomId);
  return videoUrl;
}

// 用户选中本地视频文件
async function handleSelectLocalVideo(evt){
  const file = evt.target.files[0];
  evt.target.value = "";
  if(!file) return;
  if(!currentRoomId){
    alert(lang==="zh"?"请先进入房间":"Please join room first");
    return;
  }
  await uploadVideoToSupabase(file);
}

// 广播P2P文本消息
function broadcastDataMessage(msgObj){
  Object.values(peers).forEach(p=>{
    if(p.connected) p.send(JSON.stringify(msgObj));
  })
}

//处理peer收到data消息
function handlePeerData(rawStr){
  let msg;
  try{ msg = JSON.parse(rawStr); }catch(e){return;}
  switch(msg.type){
    case "setRemoteVideo":{
      console.log("收到对方共享视频地址", msg.videoUrl);
      const player = document.getElementById("moviePlayer");
      player.src = msg.videoUrl;
      appendChat("System", lang==="zh"?"已加载对方上传视频":"Loaded shared video",null);
      break;
    }
    case "videoPlay":{
      const player = document.getElementById("moviePlayer");
      player.currentTime = msg.currentTime;
      player.play();
      break;
    }
    case "videoPause":{
      const player = document.getElementById("moviePlayer");
      player.currentTime = msg.currentTime;
      player.pause();
      break;
    }
    case "videoSeek":{
      const player = document.getElementById("moviePlayer");
      player.currentTime = msg.currentTime;
      break;
    }
  }
}

function setupPeerEvents(peer, remoteKey){
peer.on("signal", (sig)=>{
 console.log("📤发送信令");
 sendSignal(sig);
});
peer.on("stream", (remoteStream)=>{
 console.log("✅拿到远端视频流！");
 renderRemoteVideo(remoteStream, remoteKey);
});
//接收P2P数据通道消息
peer.on("data",(raw)=>{
  handlePeerData(raw);
})
peer.on("close",()=>{
 removeRemoteVideo(remoteKey);
 delete peers[remoteKey];
});
peer.on("error",(err)=>{
 console.error("peer error",err);
 removeRemoteVideo(remoteKey);
 delete peers[remoteKey];
})
}

// 播放器事件监听，同步播放指令
const moviePlayer = document.getElementById("moviePlayer");
moviePlayer.addEventListener("play",()=>{
  broadcastDataMessage({
    type:"videoPlay",
    currentTime: moviePlayer.currentTime
  })
})
moviePlayer.addEventListener("pause",()=>{
  broadcastDataMessage({
    type:"videoPause",
    currentTime: moviePlayer.currentTime
  })
})
moviePlayer.addEventListener("seeked",()=>{
  broadcastDataMessage({
    type:"videoSeek",
    currentTime: moviePlayer.currentTime
  })
})

document.addEventListener('mousedown',(e)=>{
  if(!e.target.closest('.draggable-video')) return;
  dragEl = e.target.closest('.draggable-video');
  const rect = dragEl.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  dragEl.style.position = "absolute";
  dragEl.style.zIndex = "100";
});
document.addEventListener('mousemove',(e)=>{
  if(!dragEl) return;
  dragEl.style.left = (e.clientX - dragOffsetX)+"px";
  dragEl.style.top = (e.clientY - dragOffsetY)+"px";
});
document.addEventListener('mouseup',()=>{
  dragEl = null;
});

async function registerUser(){
 if(!supabase){
  return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
 }
 const uname = document.getElementById("usernameInput").value.trim();
 const pwd = document.getElementById("pwdInput").value.trim();
 if(!uname||!pwd) return alert(lang==="zh"?"用户名密码不能为空":"Username & password required");
 const {data,error}=await supabase.from("users").insert([{username:uname,password:pwd,is_online:true}]).select();
 if(error) return alert(error.message);
 alert(lang==="zh"?"注册成功":"Register success");
 currentUser = data[0];
 showMain();
}

async function loginUser(){
 if(!supabase){
  return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
 }
 const uname = document.getElementById("usernameInput").value.trim();
 const pwd = document.getElementById("pwdInput").value.trim();
 const {data}=await supabase.from("users").select("*").eq("username",uname).eq("password",pwd).single();
 if(!data) return alert(lang==="zh"?"账号密码错误":"Wrong credentials");
 currentUser = data;
 await supabase.from("users").update({is_online:true}).eq("id",currentUser.id);
 showMain();
}

function showMain(){
 document.getElementById("authModal").classList.add("hidden");
 document.getElementById("mainPage").classList.remove("hidden");
}

async function logout(){
 if(!supabase){
  return;
 }
 await clearAllChannelsWait();
 // 删除本用户在房间成员表的记录
 if(currentRoomId && currentUser){
   await supabase.from("room_members").delete()
     .eq("room_id",currentRoomId).eq("user_id",currentUser.id);
 }
 if(memberChannel){
   supabase.removeChannel(memberChannel);
 }
 if(currentUser){
 await supabase.from("users").update({is_online:false}).eq("id",currentUser.id);
 }
 currentUser=null;
 currentRoomId=null;
 currentInviteCode=null;
 localStream=null;
 Object.values(peers).forEach(p=>p.destroy?.());
 peers={};
 document.getElementById("showRoomId").innerText="-";
 document.getElementById("showInviteCode").innerText="-";
 document.getElementById("authModal").classList.remove("hidden");
 document.getElementById("mainPage").classList.add("hidden");
}

async function createRoom(){
  if(!supabase){
    return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
  }
  await clearAllChannelsWait();
  const code = genInviteCode();
  const roomId = crypto.randomUUID();
  const {data, error}=await supabase.from("rooms").insert([{
    id: roomId,
    owner:currentUser.id,
    invite_code:code,
    movie_url:"",
    play_status:"pause",
    is_private:privateRoomMode
  }]).select();
  if(error){
    console.error("创建房间失败",error);
    return alert(lang==="zh"?"创建房间失败":"Create room failed");
  }
  currentRoomId = data[0].id;
  currentInviteCode = code;
  isRoomOwner = true;
  document.getElementById("showRoomId").innerText = currentRoomId;
  document.getElementById("showInviteCode").innerText = currentInviteCode;
  await subscribeChat();
  await subscribeWebRTCSignal();
  await subscribeRoomState();
  await subscribeRoomMember();
}

// 选中好友，创建私聊房间
async function createPrivateRoomByFriend(friendUserName){
  closeFriendPanel();
  privateRoomMode = true;
  await createRoom();
  alert(lang==="zh"?`✅私聊房间创建完成！把邀请码复制发给好友【${friendUserName}】加入`:`✅Private room created! Send invite code to friend ${friendUserName}`);
  privateRoomMode = false;
  privateSelectMode = false;
}

// ✅修复搜索：使用真实公开MP4视频地址，点击直接加载video播放器
function searchMovie(){
console.log("搜索按钮点击触发");
const kw = document.getElementById("movieSearch").value.trim();
if(!kw) return;
const resultBox = document.getElementById("movieResultList");
resultBox.classList.remove("hidden");
// 显示loading云朵
resultBox.innerHTML = `<div class="movie-loading"><i class="fa fa-cloud"></i></div>`;
// 模拟加载延迟
setTimeout(()=>{
  const mockItems = [
   {title: kw+" - 演示测试视频", url:"https://www.w3schools.com/html/mov_bbb.mp4"},
   {title: kw+" 短片样例", url:"https://www.w3schools.com/html/movie.mp4"}
  ];
  resultBox.innerHTML = "";
  mockItems.forEach(item=>{
   const div = document.createElement("div");
   div.className="p-2 movie-result-item cursor-pointer border-b border-slate-700";
   div.innerText = item.title;
   div.onclick=()=>{
      // 直接赋值video.src，不再使用iframe
      const video = document.getElementById("moviePlayer");
      video.src = item.url;
      // 存入房间数据库
      supabase.from("rooms").update({movie_url:item.url}).eq("id",currentRoomId);
      broadcastDataMessage({type:"setRemoteVideo",videoUrl:item.url});
   };
   resultBox.appendChild(div);
  })
}, 600);
}

async function clearChat(){
 document.getElementById("chatBox").innerHTML="";
}

async function sendChat(){
  console.log("sendChat被调用");
  const msg = document.getElementById("chatInput").value.trim();
  console.log("msg内容：", msg);
  console.log("currentRoomId：", currentRoomId);
  if(!msg || !currentRoomId || msg.length === 0){
    return;
  }
  const {error} = await supabase
    .from('messages_new')
    .insert({
      room_id: currentRoomId,
      author: currentUser.username,
      content: msg
    }, {
      count:'none',
      returning:'minimal'
    });
  if(error){
    console.error("🔴插入消息失败error详情：", error);
    return;
  }
  document.getElementById("chatInput").value = "";
}

function appendChat(name,text,time){
  const box = document.getElementById("chatBox");
  if (!box) return;
  const isSelf = (name === currentUser.username);
  const wrapDiv = document.createElement("div");
  wrapDiv.className = isSelf ? "msg-self" : "msg-other";
  const bubbleDiv = document.createElement("div");
  bubbleDiv.className = isSelf ? "msg-bubble-self" : "msg-bubble-other";
  const timeStr = time ? new Date(time).toLocaleTimeString() : "";
  bubbleDiv.innerHTML = `
    <div class="font-semibold text-xs">${name}</div>
    <div>${text}</div>
    <span class="msg-time">${timeStr}</span>
  `;
  wrapDiv.appendChild(bubbleDiv);
  box.appendChild(wrapDiv);
  box.scrollTop = box.scrollHeight;
}

async function startLocalVideo() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    renderLocalVideo(localStream);
    console.log("✅本地摄像头打开成功");
    const remoteKey = "peer-1";
    if(currentRoomId && !peers[remoteKey]){
      const isInitiator = !isRoomOwner;
      peers[remoteKey] = new SimplePeer({initiator:isInitiator, trickle:false, stream:localStream});
      setupPeerEvents(peers[remoteKey], remoteKey);
      console.log("P2P角色 initiator:", isInitiator);
    }
  } catch(err) {
    alert(lang==="zh"?"获取摄像头失败":"Camera access denied");
    console.error(err);
  }
}

function stopLocalVideo(){
  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
    localStream = null;
  }
  Object.keys(peers).forEach(uid=>{
    peers[uid].destroy();
    removeRemoteVideo(uid);
  });
  peers={};
  const localDom = document.getElementById("vid-local");
  if(localDom) localDom.remove();
}

function renderLocalVideo(stream){
const container = document.getElementById("videoContainer");
const div = document.createElement("div");
div.className="video-box draggable-video";
div.id="vid-local";
div.innerHTML = `<video autoplay muted playsinline></video>`;
div.querySelector("video").srcObject = stream;
container.appendChild(div);
}

function renderRemoteVideo(stream,uid){
if(document.getElementById("vid-"+uid)) return;
const container = document.getElementById("videoContainer");
const div = document.createElement("div");
div.className="video-box draggable-video";
div.id="vid-"+uid;
div.innerHTML = `
 <video autoplay playsinline></video>
  <button onclick="removeRemoteVideo('${uid}')" class="absolute top-1 right-1 bg-red-500 text-xs px-1 rounded">×</button>
`;
div.querySelector("video").srcObject = stream;
container.appendChild(div);
}

function removeRemoteVideo(uid){
const el = document.getElementById("vid-"+uid);
if(el) el.remove();
if(peers[uid]){
  peers[uid].destroy();
  delete peers[uid];
}
}

function toggleAudio(){
  if(!localStream){
    alert(lang==="zh"?"请先打开摄像头！":"Open camera first!");
    return;
  }
  const audioTracks = localStream.getAudioTracks();
  if(audioTracks.length === 0){
    alert(lang==="zh"?"没有检测到麦克风音频轨道":"No microphone audio track found");
    return;
  }
  const track = audioTracks[0];
  track.enabled = !track.enabled;
  console.log("麦克风状态切换：", track.enabled ? "开启" : "关闭");
  Object.values(peers).forEach(peer=>{
    if(peer && peer._pc){
      const audioSender = peer._pc.getSenders().find(s => s.track?.kind === "audio");
      if(audioSender){
        audioSender.replaceTrack(track);
      }
    }
  })
}

function openFriendPanel(){
  privateSelectMode = false;
  document.getElementById("friendModalTitle").innerText = i18n[lang].friendList;
  document.getElementById("friendModal").classList.remove("hidden");
  loadFriendList();
}

function closeFriendPanel(){
  privateSelectMode = false;
  document.getElementById("friendModal").classList.add("hidden");
}

async function loadFriendList(){
if(!supabase){
 return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
const dom = document.getElementById("friendListDom");
dom.innerHTML="";
const {data} = await supabase.from("friends")
.select("*,fuser:users!friends_friend_id_fkey(*)")
.eq("user_id",currentUser.id);
if(!data)return;
data.forEach(row=>{
 const f = row.fuser;
 const onlineMark = f.is_online ? '<span class="online-dot"></span>' : '<span class="offline-dot"></span>';
 let btns = "";
 if(row.status === "pending"){
 btns = `<button onclick="acceptFriend('${row.id}')" class="bg-green-500 px-2 py-1 rounded text-sm mr-1">${lang==='zh'?'同意':'Accept'}</button> <button onclick="rejectFriend('${row.id}')" class="bg-red-500 px-2 py-1 rounded text-sm">${lang==='zh'?'拒绝':'Reject'}</button>`;
 }else if(row.status==="accept"){
   if(privateSelectMode){
     btns = `<button onclick="createPrivateRoomByFriend('${f.username}')" class="bg-pink-500 px-2 py-1 rounded text-sm">${lang==='zh'?'创建私聊房间':'Create private room'}</button>`;
   }else{
     btns = `<span class="text-xs text-slate-400">${lang==='zh'?'已是好友':'Friends'}</span>`;
   }
 }
 const div = document.createElement("div");
 div.className="mb-2 p-2 bg-slate-700 rounded flex justify-between items-center";
 div.innerHTML = `<div>${onlineMark} ${f.username}</div><div>${btns}</div>`;
 dom.appendChild(div);
})
}

async function sendFriendReq(){
if(!supabase){
 return alert(lang==="zh"?"数据库还在加载，请稍等重试":"Database loading, wait and retry");
}
const fname = document.getElementById("addFriendInput").value.trim();
const {data}=await supabase.from("users").select("*").eq("username",fname).single();
if(!data) return alert(lang==="zh"?"用户不存在":"User not found");
await supabase.from("friends").insert([{user_id:currentUser.id,friend_id:data.id,status:"pending"}]);
alert(lang==="zh"?"好友请求已发送":"Friend request sent");
loadFriendList();
}

async function joinByInvite() {
  console.log("joinByInvite 执行了");
  const inviteCode = document.getElementById("joinInviteInput").value.trim();
  console.log("拿到邀请码：", inviteCode);
  if (!inviteCode) {
    alert("请输入邀请码");
    return;
  }
  await clearAllChannelsWait();
  const { data, error } = await supabase
    .from("rooms")
    .select("*")
    .eq("invite_code", inviteCode)
    .single();
  if (error || !data) {
    alert("找不到该房间");
    return;
  }
  currentRoomId = data.id;
  currentInviteCode = inviteCode;
  isRoomOwner = (data.owner === currentUser.id);
  document.getElementById("showRoomId").innerText = currentRoomId;
  document.getElementById("showInviteCode").innerText = currentInviteCode;
  await subscribeChat();
  await subscribeWebRTCSignal();
  await subscribeRoomState();
  await subscribeRoomMember();
  alert("✅成功加入房间！现在可以发送聊天消息");
}
